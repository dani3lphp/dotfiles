;==========================================================
; Polybar (Tokyo Night) - Void + bspwm + PipeWire
; Performance-focused / low-RAM / clean alignment
;==========================================================

[colors]
; Tokyo Night (Storm-ish)
bg        = #1a1b26
bg_alt    = #16161e
fg        = #c0caf5
muted     = #565f89
divider   = #3b4261

blue      = #7aa2f7
cyan      = #7dcfff
teal      = #1abc9c
green     = #9ece6a
yellow    = #e0af68
orange    = #ff9e64
red       = #f7768e
purple    = #bb9af7

background = ${colors.bg}
foreground = ${colors.fg}
primary    = ${colors.blue}
alert      = ${colors.red}
disabled   = ${colors.muted}

;==========================================================

[bar/toph]
monitor = ${env:MONITOR:}
width = 100%
height = 28pt
radius = 0
bottom = false
fixed-center = true
override-redirect = false
wm-restack = bspwm
enable-ipc = true

background = ${colors.background}
foreground = ${colors.foreground}

; IMPORTANT: remove left padding entirely (fixes workspace left gap)
padding-left  = 0
padding-right = 1

; Keep margins tight for perf + clean layout
module-margin = 0

line-size = 0
border-size = 0
border-color = #00000000

; Fonts (keep it simple for alignment):
; font-0 = text
; font-1 = icons (same size everywhere)
font-0 = JetBrainsMono Nerd Font:size=12;3
font-1 = JetBrainsMono Nerd Font Propo:size=13;4

; Layout: tray placed near the clock, clock stays last (far right edge)
modules-left  = xworkspaces sep xwindow
modules-right = volume sep backlight sep battery sep memory sep cpu sep systray sep date

cursor-click = pointer
cursor-scroll = ns-resize

[settings]
screenchange-reload = true
pseudo-transparency = true

;==========================================================
; Divider (real divider, consistent spacing)
;==========================================================
[module/sep]
type = custom/text
content = "│"
content-foreground = ${colors.divider}
content-padding = 1

;==========================================================
; Workspaces (no left padding + pill active)
;==========================================================
[module/xworkspaces]
type = internal/xworkspaces

; Remove extra padding that causes left “indent” feel
format-padding = 0

; Make all labels consistent width-ish and aligned
label-active = %name%
label-active-background = ${colors.purple}
label-active-foreground = ${colors.bg_alt}
label-active-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.fg}
label-occupied-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.bg_alt}
label-urgent-padding = 1

;==========================================================
; Window title (trim + muted)
;==========================================================
[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.fg}

;==========================================================
; Volume (use internal pulseaudio – works with PipeWire-pulse)
; Much lighter than spawning pamixer every second.
;==========================================================
[module/volume]
type = internal/pulseaudio
interval = 2

; Keep icons same font/size everywhere
format-volume = <label-volume>
label-volume = 󰕾  %percentage%%
label-volume-foreground = ${colors.primary}

format-muted = <label-muted>
label-muted = 󰝟  muted
label-muted-foreground = ${colors.muted}

; Optional interactions
click-right = pavucontrol

;==========================================================
; Backlight (internal is cheaper than scripts)
; Set card if needed: ls -1 /sys/class/backlight
;==========================================================
[module/backlight]
type = internal/backlight
card = intel_backlight
interval = 5

format = <label>
label = 󰃠  %percentage%%
label-foreground = ${colors.primary}

scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-

;==========================================================
; Battery (internal, tuned to avoid heavy reads)
;==========================================================
[module/battery]
type = custom/script
interval = 5
exec = sh -c 'B=/sys/class/power_supply/BAT0; [ -d "$B" ] || exit; c=$(cat "$B/capacity"); s=$(cat "$B/status"); if [ "$s" = "Charging" ]; then ico="󰂄"; col="%{F#9ece6a}"; else if [ "$c" -ge 90 ]; then ico="󰁹"; elif [ "$c" -ge 70 ]; then ico="󰂂"; elif [ "$c" -ge 50 ]; then ico="󰂀"; elif [ "$c" -ge 30 ]; then ico="󰁾"; elif [ "$c" -ge 15 ]; then ico="󰁼"; else ico="󰁺"; fi; col="%{F#7aa2f7}"; fi; echo "$col$ico  $c%%{F-}"'


;==========================================================
; Memory / CPU (slow intervals = less wakeups)
;==========================================================
[module/memory]
type = internal/memory
interval = 3
label = 󰍛  %used%
label-foreground = ${colors.primary}

[module/cpu]
type = internal/cpu
interval = 3
label = 󰘚  %percentage:2%%
label-foreground = ${colors.primary}

;==========================================================
; Tray (better position: near clock, not hanging at the far edge)
;==========================================================
[module/systray]
type = internal/tray
tray-size = 60%:-6px
tray-padding = 2px
tray-spacing = 8px

;==========================================================
; Clock (last module => far right edge, clean)
;==========================================================
[module/date]
type = internal/date
interval = 5
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
label = 󰥔  %date%
label-foreground = ${colors.primary}
