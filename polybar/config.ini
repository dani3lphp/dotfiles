;==========================================================
; Polybar (Tokyo Night) - Void + bspwm
; Performance-focused / low-RAM / clean alignment
;==========================================================

[colors]
bg        = #1a1b26
bg_alt    = #16161e
fg        = #c0caf5
muted     = #565f89
divider   = #3b4261

blue      = #7aa2f7
green     = #9ece6a
red       = #f7768e
purple    = #bb9af7

background = ${colors.bg}
foreground = ${colors.fg}
primary    = ${colors.blue}
alert      = ${colors.red}
disabled   = ${colors.muted}

;==========================================================

[bar/toph]
monitor = ${env:MONITOR:}
width = 100%
height = 28pt
radius = 0

bottom = false
fixed-center = true

; IMPORTANT: fixes overlap by allowing WM to manage the bar
override-redirect = false
wm-restack = bspwm
enable-ipc = true

background = ${colors.background}
foreground = ${colors.foreground}

padding-left  = 0
padding-right = 1
module-margin = 0

line-size = 0
border-size = 0
border-color = #00000000

font-0 = JetBrainsMono Nerd Font:size=12;3
font-1 = JetBrainsMono Nerd Font Propo:size=13;4

modules-left  = xworkspaces sep xwindow
modules-right = volume sep backlight sep battery sep memory sep cpu sep systray sep date

cursor-click = pointer
cursor-scroll = ns-resize

[settings]
screenchange-reload = true
pseudo-transparency = false

;==========================================================
; Divider
;==========================================================
[module/sep]
type = custom/text
content = "│"
content-foreground = ${colors.divider}
content-padding = 1

;==========================================================
; Workspaces
;==========================================================
[module/xworkspaces]
type = internal/xworkspaces
format-padding = 0

label-active = %name%
label-active-background = ${colors.purple}
label-active-foreground = ${colors.bg_alt}
label-active-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.fg}
label-occupied-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.bg_alt}
label-urgent-padding = 1

;==========================================================
; Window Title
;==========================================================
[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.fg}

;==========================================================
; Volume (PipeWire-pulse)
;==========================================================
[module/volume]
type = internal/pulseaudio
interval = 2

format-volume = <label-volume>
label-volume = 󰕾  %percentage%%
label-volume-foreground = ${colors.primary}

format-muted = <label-muted>
label-muted = 󰝟  muted
label-muted-foreground = ${colors.muted}

click-right = pavucontrol

;==========================================================
; Backlight
;==========================================================
[module/backlight]
type = internal/backlight
card = intel_backlight
interval = 5

format = <label>
label = 󰃠  %percentage%%
label-foreground = ${colors.primary}

scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-

;==========================================================
; Battery (script, no charge-rate issues)
;==========================================================
[module/battery]
type = custom/script
interval = 5
exec = ~/.config/polybar/scripts/battery.sh

;==========================================================
; Memory / CPU
;==========================================================
[module/memory]
type = internal/memory
interval = 3
label = 󰍛  %used%
label-foreground = ${colors.primary}

[module/cpu]
type = internal/cpu
interval = 3
label = 󰘚  %percentage:2%%
label-foreground = ${colors.primary}

;==========================================================
; Tray (normalized sizing)
;==========================================================
[module/systray]
type = internal/tray
tray-size = 60%:-6px
tray-padding = 2px
tray-spacing = 6px

;==========================================================
; Clock
;==========================================================
[module/date]
type = internal/date
interval = 5
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
label = 󰥔  %date%
label-foreground = ${colors.primary}
