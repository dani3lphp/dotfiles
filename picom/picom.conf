# Optimized picom.conf for GTX 1050 Ti + i5-8300H
# Performance-focused with maximum tear prevention
# Generated 2025-02-02

# Shadow settings optimized for performance
shadow = true;
shadow-radius = 6;
shadow-opacity = 0.3;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-exclude = [
  "name = 'Notification'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Conky'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@:c",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Faster fading for better responsiveness
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 8;

# Optimized opacity for better performance
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
inactive-dim = 0.0;

focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'Rofi'"
];

# Specific opacity rules optimized for common apps
opacity-rule = [
    "100:class_g = 'Alacritty' && fullscreen",
    "95:class_g = 'Alacritty' && !focused",
    "100:class_g = 'Alacritty' && focused",
    "98:class_g = 'Firefox' && !focused",
    "100:class_g = 'Firefox' && focused"
];

# Minimal blur for performance on GTX 1050 Ti
blur-kern = "3x3box";
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'Alacritty'",
  "class_g = 'Firefox'"
];

# XRENDER backend - BEST for GTX 1050 Ti (prevents tearing, better performance)
backend = "xrender";
dithered-present = false;
vsync = true;
unredir-if-possible = false;

# Performance optimizations
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
sw-opti = true;

# Better tear prevention for NVIDIA
xrender-sync = true;
xrender-sync-fence = true;
use-ewmh-active-win = true;

# Reduced polling for better CPU performance
detect-client-leader = false;

log-level = "warn";

# Optimized window types for performance
wintypes:
{
  tooltip = { 
    fade = true; 
    shadow = true; 
    opacity = 0.9; 
    focus = true; 
    full-shadow = false; 
  };
  
  dock = { 
    shadow = false; 
    clip-shadow-above = true;
    opacity = 1.0;
  };
  
  dnd = { 
    shadow = false;
    opacity = 0.8;
  };
  
  popup_menu = { 
    opacity = 0.9;
    fade = true;
  };
  
  dropdown_menu = { 
    opacity = 0.9;
    fade = true;
  };
  
  notification = {
    fade = true;
    shadow = true;
    opacity = 0.85;
    focus = false;
  };
  
  fullscreen = {
    fade = false;
    shadow = false;
    opacity = 1.0;
  };
};
